name: doctor_guide_bd
description: "Doctor Guide BD — offline symptom-to-specialist guide for Bangladeshi users."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Routing
  go_router: ^14.2.0

  # State management (simple, offline-friendly)
  provider: ^6.1.2

  # Local storage (offline persistence of saved notes)
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # PDF / Image export for "Save Doctor Visit Note"
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^9.0.0

  # Emergency call capability
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/symptoms.json
    - assets/data/specialists.json
    - assets/data/medical_degrees.json
