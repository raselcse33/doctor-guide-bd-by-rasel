name: Build Android APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=doctor_guide_bd --org=com.doctorguidebd .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctor-guide-bd-apk
          path: build/app/outputs/flutter-apk/app-release.apk
