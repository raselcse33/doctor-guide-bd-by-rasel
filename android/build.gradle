allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Ensure all library subprojects (printing, share_plus, path_provider, etc.)
// compile against Android API 34.
// NOTE: The app build.gradle already sets compileSdk 34 for :app.
subprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin("com.android.library")) {
            p.android.compileSdk = 34
        }
        if (p.plugins.hasPlugin("com.android.application")) {
            p.android.compileSdk = 34
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
